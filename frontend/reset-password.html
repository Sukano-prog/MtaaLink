<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MtaaLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px 40px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid #e9edf2;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #1a73e8;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #6b7a8f;
            font-size: 15px;
            text-align: center;
            margin-bottom: 28px;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            color: #1a2332;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d5dbe3;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #1a73e8;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #1557b0; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .message.success {
            background: #e6f7e6;
            color: #1e7e34;
            border: 1px solid #b8e6b8;
        }
        .message.error {
            background: #fde8e8;
            color: #c62828;
            border: 1px solid #f5c6c6;
        }
        .hidden { display: none; }
        .back-link { text-align: center; margin-top: 16px; }
        .back-link a { color: #1a73e8; text-decoration: none; font-size: 14px; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">MtaaLink</div>
        <div class="subtitle" id="pageTitle">Set new password</div>

        <div id="message" class="message hidden"></div>

        
        <!-- Step 1: Request reset -->
        <div id="step1">
            <p style="color: #5a6a7e; font-size: 14px; margin-bottom: 20px;">
                Enter your email address and we'll send you a link to reset your password.
            </p>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>
            <button class="btn" id="sendBtn">Send Reset Link</button>
        </div>

        <!-- Step 2: Set new password -->
        <div id="step2" style="display:none;">
            <p style="color: #5a6a7e; font-size: 14px; margin-bottom: 20px;">
                Enter your new password below.
            </p>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Min 8 characters">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password">
            </div>
            <button class="btn" id="resetBtn">Reset Password</button>
        </div>

        <div class="back-link">
            <a href="/login">Back to Login</a>
        </div>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const email = params.get('email');

            const messageDiv = document.getElementById('message');

            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = 'message ' + type;
                messageDiv.classList.remove('hidden');
                setTimeout(function() {
                    messageDiv.classList.add('hidden');
                }, 5000);
            }

            if (!token || !email) {
                showMessage('Invalid reset link. Please request a new one.', 'error');
                document.getElementById('resetBtn').disabled = true;
                return;
            }

            document.getElementById('newPassword').dataset.email = decodeURIComponent(email);
            document.getElementById('newPassword').dataset.token = token;

            document.getElementById('resetBtn').addEventListener('click', function() {
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const email = document.getElementById('newPassword').dataset.email;
                const token = document.getElementById('newPassword').dataset.token;

                if (!newPassword || newPassword.length < 8) {
                    showMessage('Password must be at least 8 characters', 'error');
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showMessage('Passwords do not match', 'error');
                    return;
                }

                const btn = this;
                btn.disabled = true;
                btn.textContent = 'Resetting...';

                const payload = {
                    email: email,
                    token: token,
                    new_password: newPassword
                };

                fetch('/api/v1/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(function(response) {
                    return response.json().then(function(data) {
                        if (response.ok) {
                            showMessage('Password reset successfully! Redirecting to login...', 'success');
                            btn.textContent = 'Success!';
                            setTimeout(function() {
                                window.location.href = '/login';
                            }, 2000);
                        } else {
                            showMessage(data.detail || 'Could not reset password. Please try again.', 'error');
                            btn.textContent = 'Reset Password';
                            btn.disabled = false;
                        }
                    });
                })
                .catch(function(error) {
                    console.error('Error:', error);
                    showMessage('Network error. Please try again.', 'error');
                    btn.textContent = 'Reset Password';
                    btn.disabled = false;
                });
            });
        })();
    </script>
</body>
</html>
