<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - MtaaLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { font-size: 28px; margin-bottom: 10px; }
        p { color: #666; font-size: 16px; line-height: 1.6; margin-bottom: 10px; }
        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s;
            margin-top: 20px;
            cursor: pointer;
        }
        .btn:hover { transform: translateY(-2px); }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
        .loading { color: #666; }
        .icon-text { font-size: 60px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container" id="content">
        <div class="icon-text">...</div>
        <h1 class="loading">Verifying your email...</h1>
        <p>Please wait while we verify your email address.</p>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const email = params.get('email');
            const content = document.getElementById('content');

            if (!token || !email) {
                content.innerHTML = `
                    <div class="icon-text">X</div>
                    <h1 class="error">Invalid Link</h1>
                    <p>Missing verification parameters.</p>
                    <a href="/login" class="btn">Go to Login</a>
                `;
                return;
            }

            const url = '/api/v1/auth/verify-email?token=' + encodeURIComponent(token) + '&email=' + encodeURIComponent(email);

            fetch(url)
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.message && data.message.indexOf('successfully') !== -1) {
                        content.innerHTML = `
                            <div class="icon-text">OK</div>
                            <h1 class="success">Email Verified!</h1>
                            <p>${data.message}</p>
                            <a href="/login" class="btn">Go to Login</a>
                        `;
                    } else {
                        content.innerHTML = `
                            <div class="icon-text">X</div>
                            <h1 class="error">Verification Failed</h1>
                            <p>${data.detail || 'Invalid or expired link.'}</p>
                            <a href="/login" class="btn">Go to Login</a>
                        `;
                    }
                })
                .catch(function() {
                    content.innerHTML = `
                        <div class="icon-text">X</div>
                        <h1 class="error">Error</h1>
                        <p>Could not verify email. Please try again.</p>
                        <a href="/login" class="btn">Go to Login</a>
                    `;
                });
        })();
    </script>
</body>
</html>
